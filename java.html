<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CJC in MC Java Download</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      margin-left: 5%;
      margin-right: 5%;
      padding: 0;
      background: white;
    }

    header {
      padding: 2%;
      text-align: center;
    }

    #headerIMG {
        width: 25%;
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      gap: 10%;
      margin-top: 2%;
      margin-bottom: 2%;
    }

    .hollow-button {
      width: 100%;
      text-align: center;
      padding: 15px 20px;
      font-size: 1rem;
      color: black;
      border: 2px solid black;
      background: transparent;
      border-radius: 8px;
      transition: all 0.3s ease;
      cursor: pointer;
      text-decoration: none;
    }

    .hollow-button:hover {
      background: black;
      color: white;
    }

    @media (max-width: 600px) {
      header {
        font-size: 1.2rem;
      }

      .hollow-button {
        flex: 1 1 100%;
      }

      #headerIMG {
        width: 95%;
      }
    }

    table {
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      padding: 10px;
      vertical-align: top;
      text-align: left;
    }
  </style>
</head>
<body>

  <header>
    <img id="headerIMG" src="img/jheader.png" alt="Cor Jesu College made in Minecraft">
  </header>

  <table width="100%">
    <hr>
      <tr>
        <th><h2>[Beta] Map Version 1 - 1.21.5<h2></th>

      </tr>
      <tr>
        <th>
            <ul>

              <li>Power Campus is unfinished.</li>
            </ul>
        </th>
      </tr>
      <tr>
        <th><h2>[Beta] Resource Pack Version 1 - 1.21.5<h2></th>
        <th width="10%" text-align="right"><a class="hollow-button" href="java/Resource Pack/Cor Jesu Essentials v1 1.21.5.zip">Download</a></th>
      </tr>
      <tr>
        <th>
            <ul>
              <li>Some textures are not refined yet.</li>

        </th>

  </table>

</html>
